name: Windows application
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        default: '0.2.10'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependency
        run: python -m pip install Pillow==11.3.0
      - name: Tests
        run: |
          python -c "import sys,unittest; sys.path.insert(0,'tests'); import test_server; names=[n for n in unittest.defaultTestLoader.getTestCaseNames(test_server.StudioTests) if n.startswith('test_windows_') or n in ('test_platform_isolation_switch_restore_and_delete','test_real_folder_and_independent_presets','test_frontend_element_references_exist_after_ui_removal','test_login_autostart_registration_is_per_user_and_reversible')]; result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(test_server.StudioTests(n) for n in names)); sys.exit(not result.wasSuccessful())"
          python -m unittest discover -s tests -p test_windows_package.py -q
          python -m unittest discover -s tests -p test_windows_apps.py -q
          python -m unittest discover -s tests -p test_updater.py -q
      - name: Build application and portable ZIP
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          python scripts/build-windows-app.py --version $env:BUILD_VERSION
          python scripts/build-windows-app.py --version $env:BUILD_VERSION --light
      - name: Verify runtime reuse and fresh downloads
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /main:RuntimeBootstrapTests /reference:System.Windows.Forms.dll /reference:System.Management.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll "/out:$pwd\dist\runtime-tests.exe" (Resolve-Path packaging/windows/RuntimeBootstrap.cs).Path (Resolve-Path packaging/windows/RuntimeBootstrapTests.cs).Path (Resolve-Path packaging/windows/Launcher.cs).Path
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap test compilation failed' }
          & dist/runtime-tests.exe (Resolve-Path dist/windows-light).Path (Join-Path $env:RUNNER_TEMP 'bubble-bootstrap-test')
          if ($LASTEXITCODE -ne 0) { throw 'Runtime resolution tests failed' }
      - name: Smoke test bundled runtimes
        env:
          BUBBLE_STUDIO_DATA: ${{ runner.temp }}/bubble-runtime-test
        run: |
          & 'dist/windows-app/runtime/python/python.exe' -c "import sys, server, autostart, ssl; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python failed' }
          & 'dist/windows-app/runtime/node/node.exe' --check dist/windows-app/app/bridge.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node failed' }
      - name: Build installer
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          & $iscc "/DAppVersion=$env:BUILD_VERSION" /DStageName=windows-light /DVariant=light packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Light installer compilation failed' }
          & $iscc "/DAppVersion=$env:BUILD_VERSION" /DStageName=windows-app /DVariant=offline packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Offline installer compilation failed' }
      - name: Verify installation and desktop launcher
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Bubble Installed'
          $unrelated = Start-Process python -ArgumentList '-c','"import time; time.sleep(240)"' -PassThru
          # Install offline first, then upgrade to light; runtime files must be removed.
          foreach ($variant in @('offline','light')) {
            $setup = (Get-ChildItem "dist/*-windows-x64-$variant-setup.exe").FullName
            $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Installation failed' }
            if ($unrelated.HasExited) { throw 'Installer stopped unrelated Python' }
            if ($variant -eq 'light' -and (Test-Path (Join-Path $install 'runtime'))) { throw 'Upgrade retained bundled runtimes' }
            $launcher = Join-Path $install 'DIY Codex Bubble.exe'
            $desktop = [Environment]::GetFolderPath('Desktop')
            if (!(Test-Path (Join-Path $desktop 'DIY Codex Bubble.lnk'))) { throw 'Desktop shortcut missing' }
            $process = Start-Process $launcher -PassThru
            if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Launcher timed out' }
            if ($process.ExitCode -ne 0) { throw 'Launcher failed' }
            $identity = Invoke-RestMethod http://127.0.0.1:19329/api/status
            if ($identity.apiVersion -ne 2) { throw 'Outdated backend reused' }
            # Opening the EXE again must replace this installation's background service.
            $oldPid = (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$install*app*server.py*" }).ProcessId
            $again = Start-Process $launcher -PassThru
            if (!$again.WaitForExit(60000) -or $again.ExitCode -ne 0) { throw 'Workshop reopen failed' }
            $newPid = (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$install*app*server.py*" }).ProcessId
            if (!$newPid -or $newPid -eq $oldPid) { throw 'Stale background process reused' }
            $status = Invoke-RestMethod http://127.0.0.1:19329/api/library
            if ($status.items.Count -lt 3) { throw 'Built-in presets missing' }
            Write-Output "$variant EXE opened the workshop; $($status.items.Count) presets loaded"
            $state = Join-Path $env:LOCALAPPDATA 'DIY Codex Bubble\Data\state.json'
            if (!(Test-Path $state)) { throw 'External settings missing' }
            $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'DIY Codex Bubble Restore.vbs'
            if (!(Test-Path $startup)) { throw 'Automatic restore entry missing' }
            if (!(Get-Content $startup -Raw).Contains('DIY Codex Bubble.exe')) { throw 'Startup bypasses runtime bootstrap' }
            # Keep the old service running during upgrade to reproduce real file locks.
            # Also leave the light service running to verify uninstall cleanup.
          }
          # The updater's silent install flag must restart the studio without a manual click.
          $beforeUpdate = (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$install*app*server.py*" }).ProcessId
          $setup = (Get-ChildItem 'dist/*-windows-x64-light-setup.exe').FullName
          $update = Start-Process $setup -ArgumentList '/VERYSILENT','/NORESTART','/BUBBLEUPDATE=1',"/DIR=`"$install`"" -Wait -PassThru
          if ($update.ExitCode -ne 0) { throw 'Automatic update install failed' }
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            Start-Sleep -Seconds 1
            try { $version = Invoke-RestMethod http://127.0.0.1:19329/api/update; if ($version.current -eq '0.2.10') { $ready = $true; break } } catch {}
          }
          if (!$ready) { throw 'Automatic update did not reopen studio' }
          $afterUpdate = (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$install*app*server.py*" }).ProcessId
          if (!$afterUpdate -or $afterUpdate -eq $beforeUpdate) { throw 'Automatic update reused old service' }
          $process = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if ($unrelated.HasExited) { throw 'Uninstaller stopped unrelated Python' }
          $unrelated.Kill()
          $remaining = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$install*app*server.py*" }
          if ($remaining) { throw 'Owned service remained after uninstall' }
          if (Test-Path $startup) { throw 'Owned startup entry was not removed' }
          if (!(Test-Path $state)) { throw 'Uninstall removed user settings' }
          Write-Output 'Uninstall removed startup entry and preserved settings'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-application
          path: |
            dist/*-windows-x64-*-setup.exe
            dist/*-windows-x64-*-portable.zip
          if-no-files-found: error
